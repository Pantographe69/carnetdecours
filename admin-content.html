<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon carnet de cours — Contenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --slate: #22282A; --slate-light: #2E3638; --paper: #FBF7EE; --paper-dim: #F0EBDD;
    --ink: #2A2620; --ink-soft: #6B6558; --amber: #D9A441; --teal: #4F8F82;
    --denim: #5C6FA3; --brick: #B5583C; --chalk: #F1EEE4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--slate); color: var(--chalk); min-height: 100vh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 56px;
    border-bottom: 1px solid rgba(241,238,228,0.08);
    background: radial-gradient(circle at 10% 0%, rgba(92,111,163,0.08), transparent 40%), var(--slate); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; color: var(--chalk); }
  .brand .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; font-weight: 700; color: var(--paper); background: var(--denim); padding: 4px 10px; border-radius: 999px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .link-btn { display: flex; align-items: center; gap: 8px; text-decoration: none; color: rgba(241,238,228,0.7);
    font-size: 13.5px; font-weight: 600; border: 1px solid rgba(241,238,228,0.16); padding: 8px 16px; border-radius: 999px;
    background: transparent; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s ease; }
  .link-btn:hover { border-color: var(--denim); color: var(--denim); }
  .link-btn.danger:hover { border-color: var(--brick); color: var(--brick); }

  main { padding: 48px 56px 80px; max-width: 1080px; margin: 0 auto; }

  .breadcrumb { font-size: 13px; color: rgba(241,238,228,0.5); margin-bottom: 10px; }
  .breadcrumb a { color: rgba(241,238,228,0.65); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { color: var(--teal); }

  .page-head h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 42px; line-height: 1.1; margin-bottom: 6px; }
  .page-head p { color: rgba(241,238,228,0.55); font-size: 15px; margin-bottom: 36px; }

  .panel { background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 0 14px 32px rgba(0,0,0,0.28); overflow: hidden; margin-bottom: 32px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 24px 28px 18px; border-bottom: 1px solid rgba(42,38,32,0.08); }
  .panel-head h2 { font-size: 17px; font-weight: 700; }
  .panel-head p { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .btn { border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; padding: 10px 18px;
    border-radius: 8px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .btn-primary { background: var(--teal); color: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
  .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  .btn-primary:active { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary[disabled] { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: 3px 3px 0 var(--ink); }
  .btn-ghost { background: transparent; border: 1px solid rgba(42,38,32,0.15); color: var(--ink); padding: 7px 13px; font-size: 12.5px; }
  .btn-ghost:hover { background: var(--paper-dim); }
  .btn-ghost-danger { background: transparent; border: 1px solid rgba(181,88,60,0.35); color: var(--brick); padding: 7px 13px; font-size: 12.5px; }
  .btn-ghost-danger:hover { background: rgba(181,88,60,0.08); }

  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0;
    background: transparent; border: 1px solid rgba(42,38,32,0.15); border-radius: 7px; color: var(--ink-soft);
    cursor: pointer; font-size: 13px; transition: all 0.15s ease; }
  .icon-btn:hover { background: var(--paper-dim); color: var(--ink); border-color: rgba(42,38,32,0.28); }
  .icon-btn.danger:hover { color: var(--brick); border-color: rgba(181,88,60,0.4); background: rgba(181,88,60,0.08); }
  .icon-btn.primary { background: var(--teal); color: var(--paper); border-color: var(--teal); }
  .icon-btn.primary:hover { background: #457a6f; }

  .row-two { display: flex; gap: 14px; }
  .row-two .field { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field select { border: none; border-bottom: 2px solid rgba(42,38,32,0.15); background: transparent;
    padding: 8px 2px 10px; font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; color: var(--ink); outline: none; transition: border-color 0.2s ease; }
  .field input:focus, .field select:focus { border-bottom-color: var(--teal); }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }

  .msg { font-size: 13px; padding: 10px 12px; border-radius: 6px; display: none; line-height: 1.4; }
  .msg.show { display: block; }
  .msg.error { background: rgba(181,88,60,0.12); color: var(--brick); }
  .msg.success { background: rgba(79,143,130,0.12); color: var(--teal); }

  .state-box { padding: 34px; text-align: center; color: var(--ink-soft); font-size: 14px; }

  /* ---- Explorateur de fichiers ---- */
  .tree { padding: 10px 14px 18px; }
  .tree-node { position: relative; }
  .tree-children { margin-left: 23px; padding-left: 14px; border-left: 1px dashed rgba(42,38,32,0.18); display: none; }
  .tree-children.open { display: block; }

  .node-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; }
  .node-row:hover { background: rgba(42,38,32,0.045); }
  .node-row.highlight { background: rgba(217,164,65,0.22); }

  .node-toggle { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; color: var(--ink-soft); border-radius: 6px; }
  .node-toggle:hover { background: rgba(42,38,32,0.08); }
  .node-toggle svg { transition: transform 0.15s ease; }
  .node-toggle.open svg { transform: rotate(90deg); }
  .node-toggle.leaf { visibility: hidden; cursor: default; }

  .node-icon { width: 22px; flex-shrink: 0; text-align: center; font-size: 16px; }
  .node-title { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .node-title .type-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    background: rgba(92,111,163,0.12); color: var(--denim); padding: 2px 7px; border-radius: 999px; margin-right: 8px; vertical-align: 1px; }
  .node-count { font-size: 11.5px; color: var(--ink-soft); flex-shrink: 0; margin-right: 2px; white-space: nowrap; }
  .node-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .node-loading { font-size: 12.5px; color: var(--ink-soft); padding: 8px 10px 8px 45px; font-style: italic; }
  .node-empty { font-size: 12.5px; color: var(--ink-soft); padding: 8px 10px 10px 45px; }

  .inline-panel { margin: 4px 0 10px 45px; padding: 16px 18px; background: var(--paper-dim); border: 1px solid rgba(42,38,32,0.08);
    border-radius: 10px; display: flex; flex-direction: column; gap: 12px; }

  @media (max-width: 720px) {
    .topbar { padding: 18px 24px; flex-wrap: wrap; gap: 12px; }
    main { padding: 32px 24px 56px; }
    .panel-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .row-two { flex-direction: column; }
    .tree-children { margin-left: 14px; padding-left: 10px; }
    .inline-panel, .node-loading, .node-empty { margin-left: 24px; padding-left: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">Mon carnet</span>
    <span class="eyebrow">🔒 Admin</span>
  </div>
  <div class="topbar-right">
    <a class="link-btn" href="admin-dashboard.html">← Administration</a>
    <button class="link-btn danger" id="btn-logout">Se déconnecter</button>
  </div>
</div>

<main>
  <div class="breadcrumb" id="breadcrumb">Chargement...</div>
  <div class="page-head">
    <h1 id="page-title">…</h1>
    <p id="page-sub">Déplie les modules, sections et activités comme un explorateur de fichiers.</p>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <h2>Contenu du cours</h2>
        <p id="panel-sub">Chargement...</p>
      </div>
      <button class="btn btn-primary" id="btn-toggle-root-add">+ Ajouter un module</button>
    </div>

    <div id="root-add-panel" style="display:none; margin: 0 28px 18px;"></div>

    <div class="msg" id="global-msg" style="margin: 0 28px 18px;"></div>
    <div class="state-box" id="tree-state">Chargement...</div>
    <div class="tree" id="tree" style="display:none;"></div>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://zahbiiddqtjcbggdtevt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HzPYCgN_qyi29hzPi8Q_wA_r0oiKj83';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function isAdmin(user) { return user?.app_metadata?.role === 'admin'; }
  async function requireAdmin() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session || !isAdmin(session.user)) { window.location.href = 'admin-login.html'; return false; }
    return true;
  }
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'admin-login.html';
  });

  function showMsg(el, text, type) { el.textContent = text; el.className = 'msg show ' + type; }
  function hideMsg(el) { el.className = 'msg'; }
  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

  const CHEVRON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
  const TYPE_ICONS = { cours: '📘', exercice: '✏️', fiche: '🗒️', test: '✅', video: '🎬' };

  // ---- Niveaux de l'arbre : modules -> sections -> activités ----
  const LEVELS = [
    { table: 'modules',   parentField: 'cours_id',   hasType: false, addLabel: '+ Ajouter une section',  emptyLabel: "Aucune section pour l'instant.",  countWord: ['module', 'modules'] },
    { table: 'sections',  parentField: 'module_id',  hasType: false, addLabel: '+ Ajouter une activité',  emptyLabel: "Aucune activité pour l'instant.", countWord: ['section', 'sections'] },
    { table: 'activites', parentField: 'section_id', hasType: true,  addLabel: null,                     emptyLabel: null,                              countWord: ['activité', 'activités'] }
  ];

  const params = new URLSearchParams(window.location.search);
  const coursId = params.get('cours_id');
  const targetModuleId = params.get('module_id');
  const targetSectionId = params.get('section_id');

  const breadcrumbEl = document.getElementById('breadcrumb');
  const pageTitleEl = document.getElementById('page-title');
  const panelSub = document.getElementById('panel-sub');
  const treeState = document.getElementById('tree-state');
  const treeEl = document.getElementById('tree');
  const globalMsg = document.getElementById('global-msg');

  if (!coursId) {
    pageTitleEl.textContent = 'Aucun cours ciblé';
    breadcrumbEl.innerHTML = '<a href="admin-dashboard.html">Administration</a>';
    treeState.textContent = "Reviens depuis l'administration pour choisir un cours.";
    throw new Error('missing cours_id');
  }

  let modules = []; // arbre en mémoire, racine

  async function fetchLevel(levelIdx, parentId) {
    const lvl = LEVELS[levelIdx];
    const fields = lvl.hasType ? 'id, titre, type, ordre' : 'id, titre, ordre';
    const { data, error } = await supabaseClient
      .from(lvl.table).select(fields).eq(lvl.parentField, parentId).order('ordre');
    if (error) throw error;
    return data || [];
  }

  function toNode(row) {
    return { ...row, expanded: false, childrenLoaded: false, children: [], addOpen: false, editOpen: false };
  }

  // Fusionne une liste fraîchement chargée avec l'ancienne, en conservant l'état
  // (déplié/replié, enfants déjà chargés) des éléments qui existent toujours.
  function mergeLevel(oldArr, freshRows) {
    const oldById = new Map(oldArr.map(n => [n.id, n]));
    return freshRows.map(row => {
      const existing = oldById.get(row.id);
      if (existing) {
        existing.titre = row.titre;
        existing.ordre = row.ordre;
        if ('type' in row) existing.type = row.type;
        return existing;
      }
      return toNode(row);
    });
  }

  // ---- Chargement racine ----
  async function loadRoot() {
    try {
      const rows = await fetchLevel(0, coursId);
      modules = mergeLevel(modules, rows);
    } catch (err) {
      treeState.textContent = 'Erreur lors du chargement : ' + err.message;
      return;
    }
    renderTree();
  }

  // ---- Contexte (titre du cours + fil d'ariane) ----
  async function loadContext() {
    const { data: c } = await supabaseClient.from('cours').select('titre').eq('id', coursId).single();
    breadcrumbEl.innerHTML = `<a href="admin-dashboard.html">Administration</a> / ${escapeHtml(c?.titre || '…')}`;
    pageTitleEl.textContent = c?.titre || 'Cours';
  }

  // ---- Rendu de l'arbre ----
  function countLabel(n, [singular, plural]) { return n + ' ' + (n > 1 ? plural : singular); }

  function renderTree() {
    if (modules.length === 0) {
      treeState.textContent = "Rien pour l'instant. Ajoute le premier module !";
      treeState.style.display = 'block';
      treeEl.style.display = 'none';
      panelSub.textContent = '0 module';
      return;
    }
    panelSub.textContent = countLabel(modules.length, LEVELS[0].countWord);
    treeState.style.display = 'none';
    treeEl.style.display = 'block';
    treeEl.innerHTML = '';
    modules.forEach(node => treeEl.appendChild(renderNode(node, 0)));
  }

  function renderNode(node, levelIdx) {
    const lvl = LEVELS[levelIdx];
    const isLeaf = levelIdx === LEVELS.length - 1;
    const wrapper = document.createElement('div');
    wrapper.className = 'tree-node';

    if (node.editOpen) {
      wrapper.appendChild(renderEditForm(node, levelIdx));
      return wrapper;
    }

    const row = document.createElement('div');
    row.className = 'node-row';
    if ((levelIdx === 0 && String(node.id) === String(targetModuleId) && !targetSectionId) ||
        (levelIdx === 1 && String(node.id) === String(targetSectionId))) {
      row.classList.add('highlight');
    }

    const icon = isLeaf ? (TYPE_ICONS[node.type] || '📄') : (node.expanded ? '📂' : '📁');
    const typeTag = isLeaf ? `<span class="type-tag">${escapeHtml(node.type || '—')}</span>` : '';

    row.innerHTML = `
      <button class="node-toggle ${node.expanded ? 'open' : ''} ${isLeaf ? 'leaf' : ''}" ${isLeaf ? 'tabindex="-1"' : ''}>${isLeaf ? '' : CHEVRON}</button>
      <span class="node-icon">${icon}</span>
      <span class="node-title">${typeTag}${escapeHtml(node.titre)}</span>
      <span class="node-count" data-count></span>
      <div class="node-actions"></div>
    `;

    const actions = row.querySelector('.node-actions');

    if (isLeaf) {
      const editLink = document.createElement('a');
      editLink.className = 'icon-btn primary';
      editLink.href = `admin-editeur.html?activite_id=${node.id}`;
      editLink.title = 'Éditer le contenu';
      editLink.textContent = '✎';
      editLink.style.width = 'auto';
      editLink.style.padding = '0 10px';
      editLink.style.textDecoration = 'none';
      actions.appendChild(editLink);
    } else {
      const addBtn = document.createElement('button');
      addBtn.className = 'icon-btn';
      addBtn.title = lvl.addLabel;
      addBtn.textContent = '+';
      addBtn.addEventListener('click', (e) => { e.stopPropagation(); node.addOpen = !node.addOpen; renderTree(); });
      actions.appendChild(addBtn);
    }

    const renameBtn = document.createElement('button');
    renameBtn.className = 'icon-btn';
    renameBtn.title = 'Modifier';
    renameBtn.textContent = '✏️';
    renameBtn.addEventListener('click', (e) => { e.stopPropagation(); node.editOpen = true; renderTree(); });
    actions.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn danger';
    delBtn.title = 'Supprimer';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteNode(node, levelIdx); });
    actions.appendChild(delBtn);

    wrapper.appendChild(row);

    if (!isLeaf) {
      const toggleBtn = row.querySelector('.node-toggle');
      const doToggle = () => toggleNode(node, levelIdx);
      toggleBtn.addEventListener('click', doToggle);
      row.querySelector('.node-icon').addEventListener('click', doToggle);
      row.querySelector('.node-title').addEventListener('click', doToggle);

      const countEl = row.querySelector('[data-count]');
      if (node.childrenLoaded) countEl.textContent = countLabel(node.children.length, LEVELS[levelIdx + 1].countWord);

      if (node.addOpen) {
        wrapper.appendChild(renderAddForm(node, levelIdx));
      }

      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'tree-children' + (node.expanded ? ' open' : '');
      if (node.expanded) {
        if (!node.childrenLoaded) {
          const loading = document.createElement('div');
          loading.className = 'node-loading';
          loading.textContent = 'Chargement...';
          childrenWrap.appendChild(loading);
        } else if (node.children.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'node-empty';
          empty.textContent = lvl.emptyLabel;
          childrenWrap.appendChild(empty);
        } else {
          node.children.forEach(child => childrenWrap.appendChild(renderNode(child, levelIdx + 1)));
        }
      }
      wrapper.appendChild(childrenWrap);
    }

    return wrapper;
  }

  async function toggleNode(node, levelIdx) {
    node.expanded = !node.expanded;
    if (node.expanded && !node.childrenLoaded) {
      renderTree(); // affiche "Chargement..." tout de suite
      try {
        const rows = await fetchLevel(levelIdx + 1, node.id);
        node.children = mergeLevel(node.children, rows);
        node.childrenLoaded = true;
      } catch (err) {
        showMsg(globalMsg, 'Erreur lors du chargement : ' + err.message, 'error');
        node.expanded = false;
      }
    }
    renderTree();
  }

  // ---- Formulaire d'ajout (module racine ou enfant d'un nœud) ----
  function buildCreateFields(hasType) {
    const div = document.createElement('div');
    div.className = 'row-two';
    div.innerHTML = `
      <div class="field" style="flex:2;">
        <label>Titre</label>
        <input type="text" class="f-titre" placeholder="Titre" required>
      </div>
      ${hasType ? `
      <div class="field">
        <label>Type</label>
        <select class="f-type">
          <option value="cours">Cours</option>
          <option value="exercice">Exercice</option>
          <option value="fiche">Fiche de révision</option>
          <option value="test">Test</option>
          <option value="video">Vidéo</option>
        </select>
      </div>` : ''}
      <div class="field" style="max-width:100px;">
        <label>Ordre</label>
        <input type="number" class="f-ordre" value="0">
      </div>
    `;
    return div;
  }

  function renderAddForm(node, levelIdx) {
    const lvl = LEVELS[levelIdx + 1];
    const panel = document.createElement('div');
    panel.className = 'inline-panel';
    const fields = buildCreateFields(lvl.hasType);
    const msg = document.createElement('div');
    msg.className = 'msg';
    const actionsRow = document.createElement('div');
    actionsRow.className = 'form-actions';
    const btnCreate = document.createElement('button');
    btnCreate.className = 'btn btn-primary';
    btnCreate.textContent = 'Créer';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-ghost';
    btnCancel.type = 'button';
    btnCancel.textContent = 'Annuler';
    actionsRow.appendChild(btnCreate);
    actionsRow.appendChild(btnCancel);
    panel.appendChild(fields);
    panel.appendChild(actionsRow);
    panel.appendChild(msg);

    btnCancel.addEventListener('click', () => { node.addOpen = false; renderTree(); });
    btnCreate.addEventListener('click', async () => {
      hideMsg(msg);
      const titre = fields.querySelector('.f-titre').value.trim();
      const ordre = parseInt(fields.querySelector('.f-ordre').value, 10) || 0;
      if (!titre) { showMsg(msg, 'Le titre est requis.', 'error'); return; }
      const payload = { titre, ordre, [lvl.parentField]: node.id };
      if (lvl.hasType) payload.type = fields.querySelector('.f-type').value;

      btnCreate.disabled = true; btnCreate.textContent = 'Création...';
      const { error } = await supabaseClient.from(lvl.table).insert(payload);
      btnCreate.disabled = false; btnCreate.textContent = 'Créer';
      if (error) { showMsg(msg, 'Erreur : ' + error.message, 'error'); return; }

      node.addOpen = false;
      // Assure que le nœud est déplié et recharge ses enfants pour montrer le nouvel élément.
      node.expanded = true;
      try {
        const rows = await fetchLevel(levelIdx + 1, node.id);
        node.children = mergeLevel(node.children, rows);
        node.childrenLoaded = true;
      } catch (err) {
        showMsg(globalMsg, 'Erreur lors du chargement : ' + err.message, 'error');
      }
      renderTree();
    });

    return panel;
  }

  function renderRootAddForm() {
    const panel = document.getElementById('root-add-panel');
    panel.innerHTML = '';
    const fields = buildCreateFields(false);
    const msg = document.createElement('div');
    msg.className = 'msg';
    const actionsRow = document.createElement('div');
    actionsRow.className = 'form-actions';
    const btnCreate = document.createElement('button');
    btnCreate.className = 'btn btn-primary';
    btnCreate.textContent = 'Créer';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-ghost';
    btnCancel.type = 'button';
    btnCancel.textContent = 'Annuler';
    actionsRow.appendChild(btnCreate);
    actionsRow.appendChild(btnCancel);
    panel.appendChild(fields);
    panel.appendChild(actionsRow);
    panel.appendChild(msg);
    panel.style.display = 'flex';
    panel.style.flexDirection = 'column';
    panel.style.gap = '12px';
    panel.style.background = 'var(--paper-dim)';
    panel.style.border = '1px solid rgba(42,38,32,0.08)';
    panel.style.borderRadius = '10px';
    panel.style.padding = '18px 20px';

    btnCancel.addEventListener('click', () => { panel.style.display = 'none'; });
    btnCreate.addEventListener('click', async () => {
      hideMsg(msg);
      const titre = fields.querySelector('.f-titre').value.trim();
      const ordre = parseInt(fields.querySelector('.f-ordre').value, 10) || 0;
      if (!titre) { showMsg(msg, 'Le titre est requis.', 'error'); return; }

      btnCreate.disabled = true; btnCreate.textContent = 'Création...';
      const { error } = await supabaseClient.from('modules').insert({ titre, ordre, cours_id: coursId });
      btnCreate.disabled = false; btnCreate.textContent = 'Créer';
      if (error) { showMsg(msg, 'Erreur : ' + error.message, 'error'); return; }

      panel.style.display = 'none';
      const rows = await fetchLevel(0, coursId);
      modules = mergeLevel(modules, rows);
      renderTree();
    });
  }
  renderRootAddForm();
  document.getElementById('btn-toggle-root-add').addEventListener('click', () => {
    const panel = document.getElementById('root-add-panel');
    panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
  });

  // ---- Édition en place ----
  function renderEditForm(node, levelIdx) {
    const lvl = LEVELS[levelIdx];
    const panel = document.createElement('div');
    panel.className = 'inline-panel';
    panel.style.marginLeft = (levelIdx === 0 ? '10px' : '45px');
    const row = document.createElement('div');
    row.className = 'row-two';
    row.innerHTML = `
      <div class="field" style="flex:2;">
        <label>Titre</label>
        <input type="text" class="e-titre" value="${escapeHtml(node.titre)}" required>
      </div>
      ${lvl.hasType ? `
      <div class="field">
        <label>Type</label>
        <select class="e-type">
          ${['cours','exercice','fiche','test','video'].map(t => `<option value="${t}" ${node.type === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="field" style="max-width:100px;">
        <label>Ordre</label>
        <input type="number" class="e-ordre" value="${node.ordre ?? 0}">
      </div>
    `;
    const actionsRow = document.createElement('div');
    actionsRow.className = 'form-actions';
    const btnSave = document.createElement('button');
    btnSave.className = 'btn btn-primary';
    btnSave.textContent = 'Enregistrer';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn btn-ghost';
    btnCancel.type = 'button';
    btnCancel.textContent = 'Annuler';
    actionsRow.appendChild(btnSave);
    actionsRow.appendChild(btnCancel);
    const msg = document.createElement('div');
    msg.className = 'msg';
    panel.appendChild(row);
    panel.appendChild(actionsRow);
    panel.appendChild(msg);

    btnCancel.addEventListener('click', () => { node.editOpen = false; renderTree(); });
    btnSave.addEventListener('click', async () => {
      hideMsg(msg);
      const titre = row.querySelector('.e-titre').value.trim();
      const ordre = parseInt(row.querySelector('.e-ordre').value, 10) || 0;
      if (!titre) { showMsg(msg, 'Le titre est requis.', 'error'); return; }
      const payload = { titre, ordre };
      if (lvl.hasType) payload.type = row.querySelector('.e-type').value;

      btnSave.disabled = true; btnSave.textContent = 'Enregistrement...';
      const { error } = await supabaseClient.from(lvl.table).update(payload).eq('id', node.id);
      btnSave.disabled = false; btnSave.textContent = 'Enregistrer';
      if (error) { showMsg(msg, 'Erreur : ' + error.message, 'error'); return; }

      Object.assign(node, payload);
      node.editOpen = false;
      renderTree();
    });

    return panel;
  }

  // ---- Suppression ----
  async function deleteNode(node, levelIdx) {
    const lvl = LEVELS[levelIdx];
    const confirmed = window.confirm('Supprimer "' + node.titre + '" ? Cette action est irréversible.');
    if (!confirmed) return;
    const { error } = await supabaseClient.from(lvl.table).delete().eq('id', node.id);
    if (error) { showMsg(globalMsg, 'Erreur lors de la suppression : ' + error.message, 'error'); return; }
    showMsg(globalMsg, 'Élément supprimé.', 'success');
    setTimeout(() => hideMsg(globalMsg), 3000);

    if (levelIdx === 0) {
      modules = modules.filter(n => n.id !== node.id);
    } else {
      // Retrouve le parent dans l'arbre pour retirer l'enfant supprimé.
      const removeFrom = (arr) => {
        for (const n of arr) {
          const idx = n.children.indexOf(node);
          if (idx !== -1) { n.children.splice(idx, 1); return true; }
          if (n.childrenLoaded && removeFrom(n.children)) return true;
        }
        return false;
      };
      removeFrom(modules);
    }
    renderTree();
  }

  // ---- Déplie automatiquement le chemin ciblé par l'URL (venant de l'éditeur) ----
  async function expandTargetPath() {
    if (!targetModuleId) return;
    const moduleNode = modules.find(m => String(m.id) === String(targetModuleId));
    if (!moduleNode) return;
    await toggleNode(moduleNode, 0);
    if (!targetSectionId) return;
    const sectionNode = moduleNode.children.find(s => String(s.id) === String(targetSectionId));
    if (!sectionNode) return;
    await toggleNode(sectionNode, 1);
    renderTree();
  }

  (async () => {
    const ok = await requireAdmin();
    if (!ok) return;
    await loadContext();
    await loadRoot();
    await expandTargetPath();
  })();
</script>
