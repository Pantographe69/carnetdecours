<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon carnet de cours — Activité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
  :root {
    --slate: #22282A; --slate-light: #2E3638; --paper: #FBF7EE; --paper-dim: #F0EBDD;
    --ink: #2A2620; --ink-soft: #6B6558; --amber: #D9A441; --teal: #4F8F82;
    --denim: #5C6FA3; --brick: #B5583C; --chalk: #F1EEE4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--slate); color: var(--chalk); min-height: 100vh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 56px;
    border-bottom: 1px solid rgba(241,238,228,0.08);
    background: radial-gradient(circle at 10% 0%, rgba(217,164,65,0.06), transparent 40%), var(--slate); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; color: var(--chalk); }
  .brand .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); font-weight: 600; }
  .link-btn { display: flex; align-items: center; gap: 8px; text-decoration: none; color: rgba(241,238,228,0.7);
    font-size: 13.5px; font-weight: 600; border: 1px solid rgba(241,238,228,0.16); padding: 8px 16px; border-radius: 999px;
    background: transparent; cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s ease; }
  .link-btn:hover { border-color: var(--denim); color: var(--denim); }

  main { padding: 48px 56px 100px; max-width: 880px; margin: 0 auto; }

  .breadcrumb { font-size: 13px; color: rgba(241,238,228,0.5); margin-bottom: 10px; }
  .breadcrumb a { color: rgba(241,238,228,0.65); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { color: var(--teal); }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .page-head h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 42px; line-height: 1.1; margin-bottom: 6px; }
  .type-tag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; background: rgba(92,111,163,0.18); color: #A9B6E0; padding: 3px 9px; border-radius: 999px; }
  .tag.optional { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; background: rgba(217,164,65,0.2); color: var(--amber); padding: 3px 9px; border-radius: 999px; margin-left: 8px; }

  .done-zone { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .btn { border: none; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; padding: 11px 20px;
    border-radius: 8px; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; white-space: nowrap; }
  .btn-primary { background: var(--teal); color: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
  .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  .btn-primary:active { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary.is-done { background: var(--paper-dim); color: var(--teal); box-shadow: 3px 3px 0 rgba(42,38,32,0.15); }
  .btn-primary[disabled] { opacity: 0.6; cursor: not-allowed; }

  .content-panel { background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 0 14px 32px rgba(0,0,0,0.28);
    padding: 44px 64px 56px; min-height: 200px; }

  #content-blocks h2, #content-blocks h3, #content-blocks h4 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin: 22px 0 10px; }
  #content-blocks h2:first-child, #content-blocks h3:first-child, #content-blocks h4:first-child { margin-top: 0; }
  #content-blocks p { line-height: 1.65; margin: 0 0 14px; }
  #content-blocks ul, #content-blocks ol { margin: 0 0 14px 22px; line-height: 1.6; }
  #content-blocks li { margin-bottom: 4px; }
  #content-blocks code { background: rgba(42,38,32,0.06); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 0.92em; }
  #content-blocks mark { background: rgba(217,164,65,0.35); }

  .render-checklist { list-style: none; margin: 0 0 14px; }
  .render-checklist li { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; line-height: 1.5; }
  .render-checklist .chk { flex-shrink: 0; }
  .render-checklist .chk.done { color: var(--teal); }

  .render-quote { border-left: 3px solid var(--denim); padding: 4px 0 4px 16px; margin: 0 0 16px; font-style: italic; color: var(--ink); }
  .render-quote cite { display: block; margin-top: 6px; font-style: normal; font-size: 12.5px; color: var(--ink-soft); }

  .render-warning { background: rgba(217,164,65,0.1); border: 1px solid rgba(217,164,65,0.3); border-radius: 10px;
    padding: 14px 16px; margin: 0 0 16px; }
  .render-warning .w-title { font-weight: 700; margin-bottom: 4px; }

  .render-code { background: #1e1e1e; border-radius: 8px; overflow: auto; margin: 0 0 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  .render-code pre { margin: 0; padding: 16px 18px; font-family: 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace;
    font-size: 13.5px; line-height: 1.55; color: #d4d4d4; }

  .render-math { margin: 0 0 16px; overflow-x: auto; padding: 6px 0; }
  .render-math .katex-error { color: var(--brick); font-size: 13px; }

  .render-delimiter { text-align: center; letter-spacing: 0.4em; color: var(--ink-soft); margin: 24px 0; }

  .render-table { border-collapse: collapse; margin: 0 0 16px; width: 100%; }
  .render-table td, .render-table th { border: 1px solid rgba(42,38,32,0.15); padding: 8px 10px; text-align: left; font-size: 14px; }
  .render-table th { background: var(--paper-dim); font-weight: 700; }

  .render-figure { text-align: center; margin: 0 0 16px; }
  .render-figure img { max-width: 100%; max-height: 480px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
  .render-figure figcaption { font-size: 13px; font-style: italic; color: var(--ink-soft); margin-top: 8px; }
  .render-video-frame { position: relative; width: 100%; max-width: 640px; margin: 0 auto; padding-top: 56.25%;
    border-radius: 10px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15); background: #000; }
  .render-video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ---- Module d'exercice : calcul mathématique ---- */
  .exo-calc {
    border: 1.5px solid rgba(217,164,65,0.35);
    background: rgba(217,164,65,0.06);
    border-radius: 12px;
    padding: 22px 24px;
    margin: 0 0 20px;
  }
  .exo-calc-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); margin-bottom: 14px; }
  .exo-calc-statement { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 17px; margin-bottom: 18px; padding: 4px 0; overflow-x: auto; }
  .exo-calc-eq { font-weight: 700; color: var(--ink); }
  .exo-calc-lines { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .exo-line { display: flex; align-items: center; gap: 10px; }
  .exo-line-num { flex-shrink: 0; width: 20px; text-align: right; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .exo-line-input {
    flex: 1; border: none; border-bottom: 2px solid rgba(42,38,32,0.18); background: transparent;
    font-family: 'JetBrains Mono', Consolas, Menlo, monospace; font-size: 15px; color: var(--ink);
    padding: 6px 4px 8px; outline: none; transition: border-color 0.2s ease;
  }
  .exo-line-input:focus { border-bottom-color: var(--denim); }
  .exo-line-input:disabled { opacity: 0.6; }
  .exo-calc-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .exo-calc-validate {
    border: none; background: var(--teal); color: var(--paper); font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 13.5px; padding: 10px 22px; border-radius: 8px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .exo-calc-validate:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  .exo-calc-validate:active:not(:disabled) { transform: translate(0,0); box-shadow: 1px 1px 0 var(--ink); }
  .exo-calc-validate:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: 3px 3px 0 rgba(42,38,32,0.15); }
  .exo-calc-feedback { font-size: 13.5px; font-weight: 600; }
  .exo-calc-feedback.success { color: var(--teal); }
  .exo-calc-feedback.error { color: var(--brick); }
  .exo-calc-done {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--teal);
    background: rgba(79,143,130,0.12); padding: 8px 16px; border-radius: 999px; font-size: 13.5px;
  }

  /* ---- Module d'exercice à plusieurs questions ---- */
  .exo-question-block { margin-bottom: 26px; }
  .exo-question-block:last-child { margin-bottom: 0; }
  .exo-question-block + .exo-question-block { border-top: 1px dashed rgba(42,38,32,0.18); padding-top: 22px; }
  .exo-question-num { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 10px; }

  /* ---- Module d'exercice : QCM ---- */
  .exo-qcm-enonce { font-size: 16.5px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
  .exo-qcm-choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .exo-qcm-option {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; font-size: 14.5px;
    border: 1.5px solid rgba(42,38,32,0.16); border-radius: 9px; background: rgba(255,255,255,0.5);
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .exo-qcm-option:hover { border-color: var(--denim); background: #fff; }
  .exo-qcm-option input { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--teal); cursor: pointer; }

  /* ---- Module d'exercice : texte à trous ---- */
  .exo-trous-text { font-size: 16px; line-height: 2.1; margin-bottom: 18px; }
  .exo-trous-input {
    display: inline-block; border: none; border-bottom: 2px solid var(--denim); background: rgba(92,111,163,0.08);
    font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: var(--ink); text-align: center;
    padding: 2px 6px; margin: 0 3px; border-radius: 4px 4px 0 0; outline: none; transition: border-color 0.2s ease;
  }
  .exo-trous-input:focus { border-bottom-color: var(--teal); background: rgba(79,143,130,0.1); }
  .exo-trous-input:disabled { opacity: 0.7; }

  /* ---- Module d'exercice : vrai ou faux ---- */
  .exo-vf-choices { display: flex; gap: 14px; margin-bottom: 18px; }
  .exo-vf-btn {
    flex: 1; padding: 16px; border: 1.5px solid rgba(42,38,32,0.16); border-radius: 10px;
    background: rgba(255,255,255,0.5); font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--ink); cursor: pointer; transition: all 0.15s ease;
  }
  .exo-vf-btn:hover:not(:disabled) { border-color: var(--denim); background: #fff; }
  .exo-vf-btn.selected { border-color: var(--denim); background: rgba(92,111,163,0.14); }
  .exo-vf-btn:disabled { cursor: default; opacity: 0.75; }

  /* ---- Module d'exercice : association ---- */
  .exo-assoc-table { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .exo-assoc-row { display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
  .exo-assoc-left { flex: 1; font-weight: 600; }
  .exo-assoc-arrow { color: var(--ink-soft); flex-shrink: 0; }
  .exo-assoc-select {
    flex: 1; border: 1.5px solid rgba(42,38,32,0.18); border-radius: 8px; background: #fff;
    font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; color: var(--ink); padding: 8px 10px; outline: none;
  }
  .exo-assoc-select:focus { border-color: var(--denim); }

  /* ---- Module d'exercice : remise dans l'ordre ---- */
  .exo-ordre-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .exo-ordre-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px;
    border: 1.5px solid rgba(42,38,32,0.16); border-radius: 9px; background: rgba(255,255,255,0.5); font-size: 14.5px;
  }
  .exo-ordre-text { flex: 1; }
  .exo-ordre-btns { display: flex; gap: 4px; flex-shrink: 0; }
  .exo-ordre-move {
    border: 1px solid rgba(42,38,32,0.18); background: #fff; border-radius: 6px; width: 28px; height: 28px;
    font-size: 12px; color: var(--ink); cursor: pointer;
  }
  .exo-ordre-move:hover:not(:disabled) { border-color: var(--denim); }
  .exo-ordre-move:disabled { opacity: 0.35; cursor: default; }

  /* ---- Module d'exercice : classement par catégories ---- */
  .exo-cat-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .exo-cat-row { display: flex; align-items: center; gap: 12px; font-size: 14.5px; }
  .exo-cat-text { flex: 1; font-weight: 600; }
  .exo-cat-select {
    flex: 1; border: 1.5px solid rgba(42,38,32,0.18); border-radius: 8px; background: #fff;
    font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; color: var(--ink); padding: 8px 10px; outline: none;
  }
  .exo-cat-select:focus { border-color: var(--denim); }

  .state-box { padding: 60px; text-align: center; color: var(--ink-soft); font-size: 14px; }

  .locked-box { background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 0 14px 32px rgba(0,0,0,0.28);
    padding: 56px 40px; text-align: center; }
  .locked-box .lock-icon { font-size: 40px; margin-bottom: 16px; display: block; }
  .locked-box h2 { font-family: 'Caveat', cursive; font-size: 30px; margin-bottom: 10px; }
  .locked-box p { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 22px; }

  .next-zone { margin-top: 28px; display: flex; justify-content: flex-end; }

  @media (max-width: 720px) {
    .topbar { padding: 18px 24px; flex-wrap: wrap; gap: 12px; }
    main { padding: 32px 24px 64px; }
    .content-panel { padding: 28px 22px 40px; }
    .page-head { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">Mon carnet</span>
    <span class="eyebrow">Activité</span>
  </div>
  <a class="link-btn" id="btn-back" href="dashboard.html">← Tes cours</a>
</div>

<main>
  <div class="breadcrumb" id="breadcrumb">Chargement...</div>

  <div id="locked-state" style="display:none;">
    <div class="locked-box">
      <span class="lock-icon">🔒</span>
      <h2>Cette activité n'est pas encore accessible</h2>
      <p>Termine d'abord les sections précédentes de ce cours pour la débloquer.</p>
      <a class="btn btn-primary" id="btn-locked-back" href="dashboard.html">Retour au cours</a>
    </div>
  </div>

  <div id="main-state" style="display:none;">
    <div class="page-head">
      <div>
        <h1 id="page-title">…</h1>
        <span class="type-tag" id="type-tag">…</span>
      </div>
      <div class="done-zone">
        <button class="btn btn-primary" id="btn-done">Marquer comme terminé</button>
      </div>
    </div>

    <div class="content-panel">
      <div id="content-blocks"></div>
    </div>

    <div class="next-zone" id="next-zone" style="display:none;"></div>
  </div>

  <div class="state-box" id="state-box">Chargement de l'activité...</div>
</main>

<script>
  const SUPABASE_URL = 'https://zahbiiddqtjcbggdtevt.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HzPYCgN_qyi29hzPi8Q_wA_r0oiKj83';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const activiteId = params.get('activite_id');

  const breadcrumbEl = document.getElementById('breadcrumb');
  const stateBox = document.getElementById('state-box');
  const lockedState = document.getElementById('locked-state');
  const mainState = document.getElementById('main-state');
  const pageTitleEl = document.getElementById('page-title');
  const typeTagEl = document.getElementById('type-tag');
  const contentBlocksEl = document.getElementById('content-blocks');
  const btnDone = document.getElementById('btn-done');
  const nextZone = document.getElementById('next-zone');
  const btnBack = document.getElementById('btn-back');
  const btnLockedBack = document.getElementById('btn-locked-back');

  function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

  // ---- Découpe le texte d'un exercice "texte à trous" en segments texte /
  // trou. Un trou s'écrit [[réponse]], ou [[réponse1|réponse2]] pour accepter
  // plusieurs réponses. Même logique que dans l'éditeur (admin-editeur.html).
  function parseTrousSegments(texte) {
    const segments = [];
    const re = /\[\[([^\]]*)\]\]/g;
    const str = texte || '';
    let lastIndex = 0;
    let m;
    while ((m = re.exec(str)) !== null) {
      if (m.index > lastIndex) segments.push({ type: 'text', value: str.slice(lastIndex, m.index) });
      const answers = m[1].split('|').map(s => s.trim()).filter(Boolean);
      segments.push({ type: 'blank', answers });
      lastIndex = re.lastIndex;
    }
    if (lastIndex < str.length) segments.push({ type: 'text', value: str.slice(lastIndex) });
    return segments;
  }

  // ---- Normalise une réponse pour la comparaison : minuscules, accents et
  // espaces superflus retirés, afin d'être tolérant sur la saisie de l'élève.
  function normalizeTrousAnswer(str) {
    return String(str || '')
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  // ---- Recalcule le verrouillage des sections d'un cours, à l'identique
  // de cours.html, pour empêcher d'ouvrir une activité verrouillée en
  // devinant simplement son URL. Les activités facultatives ne comptent pas.
  function buildLockMap(sections, termineIds) {
    let previousOk = true;
    sections.forEach(sec => {
      sec.locked = !previousOk;
      const obligatoires = sec.activites.filter(a => a.obligatoire !== false);
      const total = obligatoires.length;
      const faites = obligatoires.filter(a => termineIds.has(a.id)).length;
      sec.complete = total === 0 ? true : faites === total;
      previousOk = previousOk && sec.complete;
    });
  }

  function renderInline(html) { return html || ''; }

  function renderBlock(block, ctx) {
    const data = block.data || {};
    switch (block.type) {
      case 'header': {
        const level = Math.min(Math.max(parseInt(data.level, 10) || 2, 2), 4);
        const el = document.createElement('h' + level);
        el.innerHTML = renderInline(data.text);
        return el;
      }
      case 'paragraph': {
        const p = document.createElement('p');
        p.innerHTML = renderInline(data.text);
        return p;
      }
      case 'list': {
        const el = document.createElement(data.style === 'ordered' ? 'ol' : 'ul');
        (data.items || []).forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = renderInline(typeof item === 'string' ? item : (item.content || ''));
          el.appendChild(li);
        });
        return el;
      }
      case 'checklist': {
        const el = document.createElement('ul');
        el.className = 'render-checklist';
        (data.items || []).forEach(item => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="chk ${item.checked ? 'done' : ''}">${item.checked ? '☑' : '☐'}</span><span>${renderInline(item.text)}</span>`;
          el.appendChild(li);
        });
        return el;
      }
      case 'quote': {
        const bq = document.createElement('blockquote');
        bq.className = 'render-quote';
        bq.innerHTML = `<p>${renderInline(data.text)}</p>` + (data.caption ? `<cite>${escapeHtml(data.caption)}</cite>` : '');
        return bq;
      }
      case 'warning': {
        const div = document.createElement('div');
        div.className = 'render-warning';
        div.innerHTML = `<div class="w-title">⚠️ ${escapeHtml(data.title || '')}</div><div class="w-msg">${renderInline(data.message)}</div>`;
        return div;
      }
      case 'code': {
        const wrap = document.createElement('div');
        wrap.className = 'render-code';
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.textContent = data.code || '';
        if (data.language && data.language !== 'raw') codeEl.className = 'language-' + data.language;
        pre.appendChild(codeEl);
        wrap.appendChild(pre);
        return wrap;
      }
      case 'math': {
        const div = document.createElement('div');
        div.className = 'render-math';
        try {
          window.katex.render(data.latex || '', div, { throwOnError: true, displayMode: true });
        } catch (e) {
          div.innerHTML = '<span class="katex-error">Erreur dans la formule</span>';
        }
        return div;
      }
      case 'delimiter': {
        const div = document.createElement('div');
        div.className = 'render-delimiter';
        div.textContent = '* * *';
        return div;
      }
      case 'table': {
        const table = document.createElement('table');
        table.className = 'render-table';
        (data.content || []).forEach((row, i) => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const cellEl = document.createElement(data.withHeadings && i === 0 ? 'th' : 'td');
            cellEl.innerHTML = renderInline(cell);
            tr.appendChild(cellEl);
          });
          table.appendChild(tr);
        });
        return table;
      }
      case 'image': {
        if (!data.url) return null;
        const figure = document.createElement('figure');
        figure.className = 'render-figure';
        const img = document.createElement('img');
        img.src = data.url;
        img.alt = data.caption || '';
        figure.appendChild(img);
        if (data.caption) {
          const cap = document.createElement('figcaption');
          cap.textContent = data.caption;
          figure.appendChild(cap);
        }
        return figure;
      }
      case 'video': {
        if (!data.videoId) return null;
        const figure = document.createElement('figure');
        figure.className = 'render-figure';
        const frame = document.createElement('div');
        frame.className = 'render-video-frame';
        const iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube.com/embed/' + data.videoId;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        frame.appendChild(iframe);
        figure.appendChild(frame);
        if (data.caption) {
          const cap = document.createElement('figcaption');
          cap.textContent = data.caption;
          figure.appendChild(cap);
        }
        return figure;
      }
      case 'exoModule': {
        const knownExoTypes = ['calcul', 'qcm', 'trous', 'vraifaux', 'association', 'ordre', 'categorie'];
        if (knownExoTypes.includes(data.exoType)) return renderExoModule(data, ctx);
        return null;
      }
      default:
        return null;
    }
  }

  // ---- Évaluateur d'expressions arithmétiques sûr (pas de eval()) ----
  // Supporte + - * / ^ (), les décimales avec '.' ou ',', et 'x'/'X'/'×' comme
  // signe de multiplication (il n'y a pas de variables dans ce type d'exercice).
  function evaluateMathExpression(raw) {
    if (raw == null) return null;
    let expr = String(raw).trim();
    if (!expr) return null;
    expr = expr.replace(/,/g, '.');
    expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
    expr = expr.replace(/[xX]/g, '*');
    expr = expr.replace(/\s+/g, '');
    if (!expr) return null;
    if (!/^[0-9+\-*/^().]+$/.test(expr)) return null;

    let pos = 0;
    const peek = () => expr[pos];
    const consume = () => expr[pos++];

    function parseExpression() {
      let value = parseTerm();
      while (peek() === '+' || peek() === '-') {
        const op = consume();
        const rhs = parseTerm();
        value = op === '+' ? value + rhs : value - rhs;
      }
      return value;
    }
    function parseTerm() {
      let value = parseFactor();
      while (peek() === '*' || peek() === '/') {
        const op = consume();
        const rhs = parseFactor();
        value = op === '*' ? value * rhs : value / rhs;
      }
      return value;
    }
    function parseFactor() {
      if (peek() === '+') { consume(); return parseFactor(); }
      if (peek() === '-') { consume(); return -parseFactor(); }
      let value = parseBase();
      if (peek() === '^') { consume(); value = Math.pow(value, parseFactor()); }
      return value;
    }
    function parseBase() {
      if (peek() === '(') {
        consume();
        const value = parseExpression();
        if (peek() === ')') consume();
        return value;
      }
      const start = pos;
      while (pos < expr.length && /[0-9.]/.test(peek())) pos++;
      if (pos === start) throw new Error('bad expr');
      return parseFloat(expr.slice(start, pos));
    }

    try {
      const result = parseExpression();
      if (pos !== expr.length || !isFinite(result)) return null;
      return result;
    } catch (e) {
      return null;
    }
  }

  // ---- Rendu du bloc "Module d'exercice" : une ou plusieurs questions à la
  // suite, de type calcul mathématique ou QCM. L'activité n'est marquée
  // terminée que lorsque toutes les questions du module sont validées.
  const EXO_TYPE_LABELS = {
    calcul: '🧮 Calcul mathématique',
    qcm: '☑️ QCM',
    trous: '✏️ Texte à trous',
    vraifaux: '✅ Vrai ou faux',
    association: '🔗 Association',
    ordre: "🔢 Remise dans l'ordre",
    categorie: '🗂️ Classement par catégories'
  };

  function renderExoModule(data, ctx) {
    const wrap = document.createElement('div');
    wrap.className = 'exo-calc';

    const label = document.createElement('div');
    label.className = 'exo-calc-label';
    label.textContent = EXO_TYPE_LABELS[data.exoType] || EXO_TYPE_LABELS.calcul;
    wrap.appendChild(label);

    if (ctx && ctx.isDone) {
      const done = document.createElement('div');
      done.className = 'exo-calc-done';
      done.textContent = '✓ Exercice réussi';
      wrap.appendChild(done);
      return wrap;
    }

    // Compatible avec l'ancien format à question unique à plat
    // ({ exoType: 'calcul', entree, sortie }) pour les activités déjà enregistrées.
    const questions = (Array.isArray(data.questions) && data.questions.length)
      ? data.questions
      : (data.exoType === 'calcul' && (data.entree || data.sortie) ? [{ entree: data.entree, sortie: data.sortie }] : []);

    if (!questions.length) {
      const empty = document.createElement('p');
      empty.style.fontStyle = 'italic';
      empty.style.color = 'var(--ink-soft)';
      empty.textContent = "Cet exercice n'a pas encore de question.";
      wrap.appendChild(empty);
      return wrap;
    }

    const solvedSet = new Set();
    function handleSolved(idx) {
      solvedSet.add(idx);
      if (solvedSet.size === questions.length && ctx && ctx.onExerciseSuccess) {
        ctx.onExerciseSuccess().catch(() => { /* l'exercice reste marqué réussi visuellement */ });
      }
    }

    const questionRenderers = {
      qcm: renderQcmQuestion,
      trous: renderTrousQuestion,
      vraifaux: renderVraiFauxQuestion,
      association: renderAssociationQuestion,
      ordre: renderOrdreQuestion,
      categorie: renderCategorieQuestion,
      calcul: renderCalculQuestion
    };
    const renderQuestion = questionRenderers[data.exoType] || renderCalculQuestion;

    questions.forEach((q, idx) => {
      const qBlock = document.createElement('div');
      qBlock.className = 'exo-question-block';

      if (questions.length > 1) {
        const qNum = document.createElement('div');
        qNum.className = 'exo-question-num';
        qNum.textContent = 'Question ' + (idx + 1) + ' / ' + questions.length;
        qBlock.appendChild(qNum);
      }

      const body = renderQuestion(q, () => handleSolved(idx));
      qBlock.appendChild(body);

      wrap.appendChild(qBlock);
    });

    return wrap;
  }

  // ---- Une question de type "calcul mathématique" : l'élève tape ses
  // étapes de calcul ligne par ligne jusqu'à retrouver le résultat attendu.
  function renderCalculQuestion(q, onSolved) {
    const box = document.createElement('div');

    const statement = document.createElement('div');
    statement.className = 'exo-calc-statement';
    const exprEl = document.createElement('span');
    statement.appendChild(exprEl);
    try {
      window.katex.render(q.entree || '', exprEl, { throwOnError: true, displayMode: false });
    } catch (e) {
      exprEl.textContent = q.entree || '';
    }
    const eqMark = document.createElement('span');
    eqMark.className = 'exo-calc-eq';
    eqMark.textContent = '= ?';
    statement.appendChild(eqMark);
    box.appendChild(statement);

    const linesWrap = document.createElement('div');
    linesWrap.className = 'exo-calc-lines';
    box.appendChild(linesWrap);

    function addLine(focus) {
      const n = linesWrap.children.length + 1;
      const row = document.createElement('div');
      row.className = 'exo-line';

      const num = document.createElement('span');
      num.className = 'exo-line-num';
      num.textContent = n + '.';
      row.appendChild(num);

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'exo-line-input';
      input.placeholder = n === 1 ? 'Écris une étape, puis Entrée...' : '';
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (!input.value.trim()) return;
        const rows = Array.from(linesWrap.children);
        const isLast = rows[rows.length - 1] === row;
        if (isLast) {
          addLine(true);
        } else {
          const idx = rows.indexOf(row);
          const nextInput = rows[idx + 1] && rows[idx + 1].querySelector('input');
          if (nextInput) nextInput.focus();
        }
      });
      row.appendChild(input);

      linesWrap.appendChild(row);
      if (focus) input.focus();
      return input;
    }

    addLine(false);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      const inputs = Array.from(linesWrap.querySelectorAll('.exo-line-input'));
      let lastVal = '';
      inputs.forEach(inp => { if (inp.value.trim()) lastVal = inp.value.trim(); });

      if (!lastVal) {
        feedback.textContent = 'Écris au moins une étape avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const userResult = evaluateMathExpression(lastVal);
      const expected = evaluateMathExpression(q.sortie || '');
      const correct = userResult !== null && expected !== null && Math.abs(userResult - expected) < 1e-6;

      if (correct) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        inputs.forEach(i => { i.disabled = true; });
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type QCM : réponse unique (radio) si une seule case
  // est marquée correcte côté prof, réponses multiples (checkbox) sinon.
  function renderQcmQuestion(q, onSolved) {
    const box = document.createElement('div');

    const enonce = document.createElement('div');
    enonce.className = 'exo-qcm-enonce';
    enonce.textContent = q.enonce || '';
    box.appendChild(enonce);

    const choices = Array.isArray(q.choices) ? q.choices : [];
    const correctIdx = choices.map((c, i) => (c && c.correct) ? i : null).filter(i => i !== null).sort();
    const isMultiple = correctIdx.length > 1;
    const groupName = 'qcm-' + Math.random().toString(36).slice(2);

    const choicesWrap = document.createElement('div');
    choicesWrap.className = 'exo-qcm-choices';
    const inputEls = [];

    choices.forEach((choice, idx) => {
      const optRow = document.createElement('label');
      optRow.className = 'exo-qcm-option';

      const input = document.createElement('input');
      input.type = isMultiple ? 'checkbox' : 'radio';
      input.name = groupName;
      optRow.appendChild(input);

      const text = document.createElement('span');
      text.textContent = choice && choice.text ? choice.text : '';
      optRow.appendChild(text);

      choicesWrap.appendChild(optRow);
      inputEls.push(input);
    });
    box.appendChild(choicesWrap);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      const selected = inputEls.map((el, idx) => el.checked ? idx : null).filter(v => v !== null).sort();

      if (!selected.length) {
        feedback.textContent = 'Choisis au moins une réponse avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const correct = correctIdx.length > 0 && selected.length === correctIdx.length
        && selected.every((v, i) => v === correctIdx[i]);

      if (correct) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        inputEls.forEach(el => { el.disabled = true; });
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type "texte à trous" : l'élève complète un ou
  // plusieurs champs insérés directement dans le texte de l'énoncé.
  function renderTrousQuestion(q, onSolved) {
    const box = document.createElement('div');

    const textWrap = document.createElement('div');
    textWrap.className = 'exo-trous-text';

    const segments = parseTrousSegments(q.texte);
    const blankInputs = [];
    const blankAnswers = [];

    segments.forEach(seg => {
      if (seg.type === 'text') {
        textWrap.appendChild(document.createTextNode(seg.value));
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'exo-trous-input';
        const longest = seg.answers.reduce((m, a) => Math.max(m, a.length), 3);
        input.size = Math.min(Math.max(longest + 1, 3), 24);
        textWrap.appendChild(input);
        blankInputs.push(input);
        blankAnswers.push(seg.answers);
      }
    });

    box.appendChild(textWrap);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      if (!blankInputs.length) {
        feedback.textContent = "Cette question n'a pas de trou à compléter.";
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const allFilled = blankInputs.every(inp => inp.value.trim());
      if (!allFilled) {
        feedback.textContent = 'Complète tous les trous avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const allCorrect = blankInputs.every((inp, i) => {
        const got = normalizeTrousAnswer(inp.value);
        return blankAnswers[i].some(ans => normalizeTrousAnswer(ans) === got);
      });

      if (allCorrect) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        blankInputs.forEach(inp => { inp.disabled = true; });
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type "vrai ou faux" : deux boutons pour choisir. ----
  function renderVraiFauxQuestion(q, onSolved) {
    const box = document.createElement('div');

    const enonce = document.createElement('div');
    enonce.className = 'exo-qcm-enonce';
    enonce.textContent = q.enonce || '';
    box.appendChild(enonce);

    const choicesWrap = document.createElement('div');
    choicesWrap.className = 'exo-vf-choices';

    let selected = null;
    const trueBtn = document.createElement('button');
    trueBtn.type = 'button';
    trueBtn.className = 'exo-vf-btn';
    trueBtn.textContent = 'Vrai';
    const falseBtn = document.createElement('button');
    falseBtn.type = 'button';
    falseBtn.className = 'exo-vf-btn';
    falseBtn.textContent = 'Faux';

    function updateSelection() {
      trueBtn.classList.toggle('selected', selected === true);
      falseBtn.classList.toggle('selected', selected === false);
    }
    trueBtn.addEventListener('click', () => { selected = true; updateSelection(); });
    falseBtn.addEventListener('click', () => { selected = false; updateSelection(); });

    choicesWrap.appendChild(trueBtn);
    choicesWrap.appendChild(falseBtn);
    box.appendChild(choicesWrap);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      if (selected === null) {
        feedback.textContent = 'Choisis Vrai ou Faux avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const correct = selected === !!q.reponse;
      if (correct) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        trueBtn.disabled = true;
        falseBtn.disabled = true;
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type "association" : chaque élément de gauche est
  // associé à une réponse choisie dans une liste déroulante mélangée. ----
  function renderAssociationQuestion(q, onSolved) {
    const box = document.createElement('div');

    const paires = Array.isArray(q.paires) ? q.paires : [];
    const shuffled = paires.map((p, i) => ({ texte: p.droite, origIndex: i }));
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const table = document.createElement('div');
    table.className = 'exo-assoc-table';
    const selects = [];

    paires.forEach((paire, idx) => {
      const row = document.createElement('div');
      row.className = 'exo-assoc-row';

      const left = document.createElement('span');
      left.className = 'exo-assoc-left';
      left.textContent = paire.gauche || '';
      row.appendChild(left);

      const arrow = document.createElement('span');
      arrow.className = 'exo-assoc-arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);

      const select = document.createElement('select');
      select.className = 'exo-assoc-select';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- choisis --';
      select.appendChild(placeholder);
      shuffled.forEach((s, sIdx) => {
        const opt = document.createElement('option');
        opt.value = String(sIdx);
        opt.textContent = s.texte || '';
        select.appendChild(opt);
      });
      row.appendChild(select);
      selects.push(select);

      table.appendChild(row);
    });

    box.appendChild(table);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      const allSelected = selects.every(s => s.value !== '');
      if (!allSelected) {
        feedback.textContent = 'Complète toutes les associations avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const allCorrect = selects.every((s, idx) => {
        const sIdx = parseInt(s.value, 10);
        return shuffled[sIdx] && shuffled[sIdx].origIndex === idx;
      });

      if (allCorrect) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        selects.forEach(s => { s.disabled = true; });
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type "remise dans l'ordre" : les éléments sont
  // mélangés, et l'élève les réordonne avec des flèches ▲▼. ----
  function renderOrdreQuestion(q, onSolved) {
    const box = document.createElement('div');

    if (q.enonce) {
      const enonce = document.createElement('div');
      enonce.className = 'exo-qcm-enonce';
      enonce.textContent = q.enonce;
      box.appendChild(enonce);
    }

    const originalItems = Array.isArray(q.items) ? q.items : [];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let order = originalItems.map((text, i) => ({ text, origIndex: i }));
    if (order.length > 1) {
      let attempts = 0;
      let candidate = shuffle(order);
      while (attempts < 8 && candidate.every((it, i) => it.origIndex === i)) {
        candidate = shuffle(order);
        attempts++;
      }
      order = candidate;
    }

    const list = document.createElement('div');
    list.className = 'exo-ordre-list';
    box.appendChild(list);

    let locked = false;

    function renderList() {
      list.innerHTML = '';
      order.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'exo-ordre-row';

        const text = document.createElement('span');
        text.className = 'exo-ordre-text';
        text.textContent = item.text || '';
        row.appendChild(text);

        const btns = document.createElement('div');
        btns.className = 'exo-ordre-btns';

        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'exo-ordre-move';
        upBtn.textContent = '▲';
        upBtn.disabled = locked || idx === 0;
        upBtn.addEventListener('click', () => {
          [order[idx - 1], order[idx]] = [order[idx], order[idx - 1]];
          renderList();
        });
        btns.appendChild(upBtn);

        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'exo-ordre-move';
        downBtn.textContent = '▼';
        downBtn.disabled = locked || idx === order.length - 1;
        downBtn.addEventListener('click', () => {
          [order[idx], order[idx + 1]] = [order[idx + 1], order[idx]];
          renderList();
        });
        btns.appendChild(downBtn);

        row.appendChild(btns);
        list.appendChild(row);
      });
    }

    renderList();

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      const correct = order.every((item, idx) => item.origIndex === idx);
      if (correct) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        locked = true;
        renderList();
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  // ---- Une question de type "classement par catégories" : chaque élément
  // est rangé dans la bonne catégorie via une liste déroulante. ----
  function renderCategorieQuestion(q, onSolved) {
    const box = document.createElement('div');

    if (q.enonce) {
      const enonce = document.createElement('div');
      enonce.className = 'exo-qcm-enonce';
      enonce.textContent = q.enonce;
      box.appendChild(enonce);
    }

    const categories = Array.isArray(q.categories) ? q.categories : [];
    const items = Array.isArray(q.items) ? q.items : [];

    const list = document.createElement('div');
    list.className = 'exo-cat-list';
    const selects = [];

    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'exo-cat-row';

      const text = document.createElement('span');
      text.className = 'exo-cat-text';
      text.textContent = item.texte || '';
      row.appendChild(text);

      const select = document.createElement('select');
      select.className = 'exo-cat-select';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- choisis --';
      select.appendChild(placeholder);
      categories.forEach((cat, cIdx) => {
        const opt = document.createElement('option');
        opt.value = String(cIdx);
        opt.textContent = cat || ('Catégorie ' + (cIdx + 1));
        select.appendChild(opt);
      });
      row.appendChild(select);
      selects.push(select);

      list.appendChild(row);
    });

    box.appendChild(list);

    const actions = document.createElement('div');
    actions.className = 'exo-calc-actions';
    const validateBtn = document.createElement('button');
    validateBtn.type = 'button';
    validateBtn.className = 'exo-calc-validate';
    validateBtn.textContent = 'Valider';
    actions.appendChild(validateBtn);

    const feedback = document.createElement('span');
    feedback.className = 'exo-calc-feedback';
    actions.appendChild(feedback);
    box.appendChild(actions);

    validateBtn.addEventListener('click', () => {
      const allSelected = selects.every(s => s.value !== '');
      if (!allSelected) {
        feedback.textContent = 'Classe tous les éléments avant de valider.';
        feedback.className = 'exo-calc-feedback error';
        return;
      }

      const allCorrect = selects.every((s, idx) => parseInt(s.value, 10) === (items[idx].categorie || 0));

      if (allCorrect) {
        feedback.textContent = '✓ Bravo, c\'est correct !';
        feedback.className = 'exo-calc-feedback success';
        selects.forEach(s => { s.disabled = true; });
        validateBtn.disabled = true;
        onSolved();
      } else {
        feedback.textContent = 'Ce n\'est pas encore ça, réessaie.';
        feedback.className = 'exo-calc-feedback error';
      }
    });

    return box;
  }

  function renderContent(contenu, ctx) {
    contentBlocksEl.innerHTML = '';
    const blocks = (contenu && contenu.blocks) || [];
    if (blocks.length === 0) {
      const p = document.createElement('p');
      p.style.color = 'var(--ink-soft)';
      p.style.fontStyle = 'italic';
      p.textContent = "Cette activité n'a pas encore de contenu.";
      contentBlocksEl.appendChild(p);
      return;
    }
    blocks.forEach(block => {
      const el = renderBlock(block, ctx);
      if (el) contentBlocksEl.appendChild(el);
    });
    if (window.Prism) window.Prism.highlightAllUnder(contentBlocksEl);
  }

  (async () => {
    if (!activiteId) {
      stateBox.textContent = 'Aucune activité ciblée.';
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    const userId = session.user.id;

    const { data: a } = await supabaseClient
      .from('activites').select('id, titre, type, contenu, section_id, obligatoire').eq('id', activiteId).single();

    if (!a) {
      stateBox.textContent = "Cette activité n'existe pas ou plus.";
      return;
    }

    const { data: s } = await supabaseClient.from('sections').select('id, titre, ordre, module_id').eq('id', a.section_id).single();
    const { data: m } = s ? await supabaseClient.from('modules').select('id, titre, ordre, cours_id').eq('id', s.module_id).single() : { data: null };
    const { data: c } = m ? await supabaseClient.from('cours').select('id, titre').eq('id', m.cours_id).single() : { data: null };

    const coursHref = m ? ('cours.html?id=' + m.cours_id) : 'dashboard.html';
    breadcrumbEl.innerHTML = `<a href="dashboard.html">Tes cours</a> / <a href="${coursHref}">${escapeHtml(c?.titre || '…')}</a> / ${escapeHtml(s?.titre || '…')}`;
    btnBack.href = coursHref;
    btnLockedBack.href = coursHref;

    if (!m) {
      stateBox.textContent = "Impossible de retrouver le cours de cette activité.";
      return;
    }

    // ---- Recharge tout l'arbre du cours pour revérifier le verrouillage
    // côté client, même si l'élève arrive directement via l'URL.
    const { data: modules } = await supabaseClient.from('modules').select('id, ordre').eq('cours_id', m.cours_id).order('ordre');
    const moduleIds = (modules || []).map(x => x.id);
    const { data: sections } = moduleIds.length
      ? await supabaseClient.from('sections').select('id, ordre, module_id').in('module_id', moduleIds).order('ordre')
      : { data: [] };
    const sectionIds = (sections || []).map(x => x.id);
    const { data: activites } = sectionIds.length
      ? await supabaseClient.from('activites').select('id, section_id, obligatoire').in('section_id', sectionIds)
      : { data: [] };
    const { data: progression } = await supabaseClient.from('progression').select('activite_id, termine').eq('user_id', userId);
    const termineIds = new Set((progression || []).filter(p => p.termine).map(p => p.activite_id));

    const sectionTree = (modules || []).flatMap(mod =>
      (sections || []).filter(s2 => s2.module_id === mod.id).map(s2 => ({
        id: s2.id,
        activites: (activites || []).filter(ac => ac.section_id === s2.id).map(ac => ({ id: ac.id, obligatoire: ac.obligatoire }))
      }))
    );
    buildLockMap(sectionTree, termineIds);

    const mySection = sectionTree.find(s2 => s2.id === a.section_id);
    if (mySection && mySection.locked) {
      stateBox.style.display = 'none';
      lockedState.style.display = 'block';
      return;
    }

    pageTitleEl.textContent = a.titre;
    typeTagEl.textContent = a.type || '—';
    if (a.obligatoire === false) {
      const optTag = document.createElement('span');
      optTag.className = 'tag optional';
      optTag.textContent = 'Optionnel';
      typeTagEl.insertAdjacentElement('afterend', optTag);
    }

    let isDone = termineIds.has(a.id);
    function updateDoneButton() {
      btnDone.textContent = isDone ? '✓ Terminé' : 'Marquer comme terminé';
      btnDone.classList.toggle('is-done', isDone);
    }
    updateDoneButton();

    // Utilisé à la fois par le bouton "Marquer comme terminé" et par la
    // validation réussie d'un module d'exercice dans le contenu.
    async function markDone(value) {
      const { error } = await supabaseClient
        .from('progression')
        .upsert({ user_id: userId, activite_id: a.id, termine: value }, { onConflict: 'user_id,activite_id' });
      if (error) throw error;
      isDone = value;
      updateDoneButton();
    }

    renderContent(a.contenu, { isDone, onExerciseSuccess: () => markDone(true) });

    btnDone.addEventListener('click', async () => {
      btnDone.disabled = true;
      try {
        await markDone(!isDone);
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
      btnDone.disabled = false;
    });

    stateBox.style.display = 'none';
    mainState.style.display = 'block';
  })();
</script>

</body>
